<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="adminBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2738" />
      <stop offset="100%" stop-color="#0E131F" />
    </linearGradient>
    <linearGradient id="adminGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBAA" />
      <stop offset="35%" stop-color="#E5BA5A" />
      <stop offset="70%" stop-color="#B88628" />
      <stop offset="100%" stop-color="#F7DC94" />
    </linearGradient>
    <linearGradient id="gearGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2C6" />
      <stop offset="50%" stop-color="#E2B755" />
      <stop offset="100%" stop-color="#9E6E17" />
    </linearGradient>
  </defs>

  <!-- Circular Dark Navy Background -->
  <circle cx="32" cy="32" r="30" fill="url(#adminBg)" stroke="url(#adminGold)" stroke-width="2" />
  <circle cx="32" cy="32" r="27" fill="none" stroke="#2D3B55" stroke-width="1" stroke-dasharray="2.5 2" />

  <!-- Wedding Rings Base (Top & Center) -->
  <g opacity="0.9">
    <circle cx="25" cy="27" r="10" fill="none" stroke="url(#adminGold)" stroke-width="2.6" />
    <circle cx="38" cy="27" r="10" fill="none" stroke="url(#adminGold)" stroke-width="2.6" />
    <!-- Overlap -->
    <path d="M28 17.5 A10 10 0 0 1 35 27" fill="none" stroke="url(#adminGold)" stroke-width="2.6" stroke-linecap="round" />
    <!-- Mini Diamond Sparkle on Left Ring -->
    <polygon points="25,12 26.5,14 28.5,14.5 26.5,15 25,17 23.5,15 21.5,14.5 23.5,14" fill="#FFEBAA" />
  </g>

  <!-- Admin Settings Gear Badge (Foreground Bottom-Right) -->
  <g transform="translate(32, 32)">
    <!-- Gear Backdrop Circle -->
    <circle cx="10" cy="10" r="13.5" fill="#141A26" stroke="url(#adminGold)" stroke-width="1.8" />
    
    <!-- 8-Teeth Gear Symbol -->
    <path d="
      M9,1 L11,1 L11.4,3.2 L13.2,3.9 L14.9,2.5 L16.3,3.9 L14.9,5.6 L15.6,7.4 L17.8,7.8 L17.8,9.8 L15.6,10.2 L14.9,12 L16.3,13.7 L14.9,15.1 L13.2,13.7 L11.4,14.4 L11,16.6 L9,16.6 L8.6,14.4 L6.8,13.7 L5.1,15.1 L3.7,13.7 L5.1,12 L4.4,10.2 L2.2,9.8 L2.2,7.8 L4.4,7.4 L5.1,5.6 L3.7,3.9 L5.1,2.5 L6.8,3.9 L8.6,3.2 Z
    " fill="url(#gearGold)" />
    
    <!-- Gear Center Hole -->
    <circle cx="10" cy="8.8" r="3.2" fill="#141A26" stroke="url(#adminGold)" stroke-width="1.2" />
    <circle cx="10" cy="8.8" r="1.3" fill="#FFEBAA" />
  </g>

  <!-- Green Live Indicator Dot (Top-Right) -->
  <circle cx="49" cy="15" r="3" fill="#10B981" stroke="#0E131F" stroke-width="1.2" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="35%" stop-color="#E2B755" />
      <stop offset="70%" stop-color="#B88628" />
      <stop offset="100%" stop-color="#F5D98B" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8F3EA" />
    </linearGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E1F3FE" />
      <stop offset="100%" stop-color="#96CEF6" />
    </linearGradient>
  </defs>

  <!-- Circular Elegant Ivory Background -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#DFCFB7" stroke-width="2" />
  <circle cx="32" cy="32" r="27" fill="none" stroke="#EFE4D3" stroke-width="1" stroke-dasharray="2.5 2" />

  <!-- Left Ring -->
  <circle cx="24" cy="35" r="12" fill="none" stroke="url(#ringGold)" stroke-width="3.5" />

  <!-- Right Ring (Interlocking) -->
  <circle cx="40" cy="35" r="12" fill="none" stroke="url(#ringGold)" stroke-width="3.5" />

  <!-- Interlocking overlap weaving -->
  <path d="M28 23.7 A12 12 0 0 1 36 35" fill="none" stroke="url(#ringGold)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Diamond Gem on Left Ring -->
  <g transform="translate(24, 23)">
    <polygon points="0,-12 6,-6 4,0 -4,0 -6,-6" fill="url(#diamondGrad)" stroke="#74B4DE" stroke-width="0.75" />
    <polygon points="0,-12 4,0 -4,0" fill="#EBF6FF" opacity="0.75" />
    <polygon points="-6,-6 0,-12 6,-6" fill="#FFFFFF" opacity="0.9" />
    <path d="M-5,0 L-4,-4 M5,0 L4,-4" stroke="url(#ringGold)" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Sparkling Stars -->
  <path d="M48 14 L49.5 18 L53.5 19.5 L49.5 21 L48 25 L46.5 21 L42.5 19.5 L46.5 18 Z" fill="#E6B347" />
  <circle cx="13" cy="20" r="1.5" fill="#E6B347" opacity="0.85" />
  <circle cx="52" cy="28" r="1.2" fill="#E6B347" opacity="0.75" />

  <!-- Central Romantic Rose Heart -->
  <path d="M32 35.5 C32 33.5 30 31.8 28 32.5 C26 33.2 26.5 35.5 32 39 C37.5 35.5 38 33.2 36 32.5 C34 31.8 32 33.5 32 35.5 Z" fill="#E8827C" opacity="0.95" />
</svg>
